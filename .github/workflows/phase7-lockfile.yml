name: One-time browser test dependency lockfile refresh
on:
  push:
    branches: ["test/phase-7-browser-qa"]
    paths: ["frontend/package.json"]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --package-lock-only --ignore-scripts --no-audit
        working-directory: frontend
      - name: Commit dependency lock
        run: |
          if git diff --quiet -- frontend/package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: lock Playwright test dependencies"
          git push origin HEAD:test/phase-7-browser-qa
