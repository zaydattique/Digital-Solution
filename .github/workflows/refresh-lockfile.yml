name: Refresh frontend dependency lockfile

on:
  push:
    branches:
      - "fix/phase-5-backend-security-reliability"
    paths:
      - frontend/package.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit updated lockfile to the same branch
        run: |
          if git diff --quiet -- frontend/package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: refresh lockfile for patched Next.js"
          git push origin HEAD:fix/phase-5-backend-security-reliability
