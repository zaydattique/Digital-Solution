name: One-time dependency lockfile refresh
on:
  push:
    branches:
      - "fix/phase-5-backend-security-reliability"
    paths:
      - frontend/package.json
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --package-lock-only --ignore-scripts --no-audit
        working-directory: frontend
      - name: Commit lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: refresh dependency integrity lockfile"
          git push origin HEAD:fix/phase-5-backend-security-reliability
