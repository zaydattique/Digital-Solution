name: Temporary backend dependency lockfile refresh
on:
  push:
    branches: ["feat/havocx-vercel-services-admin-foundation"]
    paths: ["backend/package.json"]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --package-lock-only --ignore-scripts --no-audit
        working-directory: backend
      - name: Commit lockfile
        run: |
          if git diff --quiet -- backend/package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore: update locked Sharp dependency"
          git push origin HEAD:feat/havocx-vercel-services-admin-foundation
