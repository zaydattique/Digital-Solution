name: One-time backend dependency security refresh

on:
  push:
    branches:
      - fix/havocx-finalize-site-20261116

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Resolve patched backend dependencies
        working-directory: backend
        run: |
          npm install zod@4.6.7 --save-exact --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Commit resolved lockfile to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): update patched backend dependency lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
