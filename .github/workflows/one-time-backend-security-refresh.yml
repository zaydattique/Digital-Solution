name: One-time backend dependency security refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.head_ref == 'fix/havocx-finalize-site-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Resolve patched backend dependencies
        working-directory: backend
        run: |
          npm pkg set dependencies.zod=4.6.7
          npm pkg set overrides.body-parser=2.4.0 overrides.qs=6.16.1 overrides.ip-address=10.7.4
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Commit patched dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): refresh backend production dependencies"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
